# Local MongoDB for development: a single-node replica set, because the app
# uses transactions and MongoDB only allows them on a replica set.
#
#   docker compose up -d
#   MONGODB_URI=mongodb://localhost:27017/?replicaSet=rs0
#
# The healthcheck also initiates the replica set the first time (rs.initiate),
# so no manual step is needed.

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --port 27017 --quiet --eval
        "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }"
      interval: 5s
      timeout: 30s
      retries: 30

volumes:
  mongo-data:
